// Proyek induk. Build sebenarnya ada di versions/1.21.1/fabric/build.gradle
//   ./gradlew :fabric-1.21.1:build   ->   build/libs/maoudrift-fabric-1.21.1-<versi>.jar
tasks.register('build') {
    group = 'build'
    dependsOn ':fabric-1.21.1:build'
}
tasks.register('clean', Delete) {
    group = 'build'
    dependsOn ':fabric-1.21.1:clean'
    delete layout.buildDirectory
}
