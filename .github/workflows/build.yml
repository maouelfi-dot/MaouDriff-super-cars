name: Build Maou Drift
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew :fabric-1.21.1:build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: maoudrift-fabric-1.21.1
          path: versions/1.21.1/fabric/build/libs/*.jar
