name: Build dari maou.zip
on:
  push:
    paths:
      - 'maou.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak maou.zip
        run: |
          mkdir src
          unzip -q maou.zip -d src
          # kalau isi zip ada di dalam 1 folder, masuk ke folder itu
          if [ ! -f src/gradlew ]; then
            d=$(dirname "$(find src -maxdepth 3 -name gradlew | head -n1)")
            mv "$d" src_real && rm -rf src && mv src_real src
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: src
        run: chmod +x gradlew && ./gradlew :fabric-1.21.1:build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: maoudrift-fabric-1.21.1
          path: src/versions/1.21.1/fabric/build/libs/*.jar
